# Builds the Next.js site (served at the root) and the Angular site (served at /angular/)
# and publishes both to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5

      - name: Build Next.js
        working-directory: nextjs
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm ci
          npx next build

      - name: Build Angular
        working-directory: angular
        env:
          NG_CLI_ANALYTICS: "false"
        run: |
          npm ci
          npx ng build --base-href "${{ steps.pages.outputs.base_path }}/angular/"

      - name: Combine sites
        run: |
          mkdir -p site
          cp -r nextjs/out/. site/
          mkdir -p site/angular
          cp -r angular/dist/. site/angular/
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
