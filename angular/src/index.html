  <style>
    /* Loading screen: lab instruments take turns spinning inside a green ring until the page has loaded */
    #loader { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #f6faf1; transition: opacity .5s ease, visibility .5s; }
    #loader.done { opacity: 0; visibility: hidden; }
    #loader .ring { position: relative; width: 132px; height: 132px; }
    #loader .ring::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 5px solid #dcebc9; border-top-color: #7eb043; animation: ld-spin 1s linear infinite; }
    #loader svg { position: absolute; inset: 0; margin: auto; width: 70px; height: 70px; opacity: 0; animation: ld-swap 4s linear infinite; }
    #loader svg:nth-of-type(2) { animation-delay: 1s; } #loader svg:nth-of-type(3) { animation-delay: 2s; } #loader svg:nth-of-type(4) { animation-delay: 3s; }
    @keyframes ld-spin { to { transform: rotate(360deg); } }
    @keyframes ld-swap { 0% { opacity: 0; transform: scale(.4) rotate(-180deg); } 6%, 19% { opacity: 1; transform: scale(1) rotate(0); } 25%, 100% { opacity: 0; transform: scale(.4) rotate(180deg); } }
    @media (prefers-reduced-motion: reduce) { #loader .ring::before { animation-duration: 3s; } }
  </style>

      <!-- Test tubes -->

      <!-- Microscope -->
      <svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="#2f5a12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 56h36M22 56c0-10 8-16 18-16"/><path d="M26 8l8 4-10 20-8-4z" fill="#fff"/><path d="M20 30l-2 4M30 12l3-6"/><path d="M40 40a10 10 0 0 0-6-18"/><path d="M26 46h14"/></g><circle cx="34" cy="22" r="3" fill="#7eb043"/></svg>
      <!-- DNA -->
      <svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke-width="3.5" stroke-linecap="round"><path d="M20 6c0 14 24 14 24 26S20 44 20 58" stroke="#2f5a12"/><path d="M44 6c0 14-24 14-24 26s24 12 24 26" stroke="#7eb043"/></g><g stroke="#0b6fb3" stroke-width="2.5" stroke-linecap="round"><path d="M24 14h16M28 20h8M24 50h16M28 44h8"/></g></svg>
    </div>
  </div>
  <script>
    (function () {
      var hide = function () { var l = document.getElementById('loader'); if (l) { l.classList.add('done'); setTimeout(function () { l.remove(); }, 600); } };
      if (document.readyState === 'complete') hide(); else window.addEventListener('load', hide);
      setTimeout(hide, 8000);
    })();
  </script>
