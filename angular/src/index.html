  <style>
    /* Loading screen: a spinning lab flask until the page and its images have loaded */
    #loader { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #f6faf1; transition: opacity .5s ease, visibility .5s; }
    #loader.done { opacity: 0; visibility: hidden; }
    #loader .ring { position: relative; width: 132px; height: 132px; border-radius: 50%; border: 5px solid #dcebc9; border-top-color: #7eb043; animation: ld-spin 1s linear infinite; }
    #loader svg { position: absolute; inset: 0; margin: auto; width: 72px; height: 72px; animation: ld-spin 1.6s cubic-bezier(.6, 0, .4, 1) infinite reverse; }
    #loader .bub { animation: ld-bub 1.2s ease-in infinite; }
    #loader .bub:nth-of-type(2) { animation-delay: .4s; } #loader .bub:nth-of-type(3) { animation-delay: .8s; }
    @keyframes ld-spin { to { transform: rotate(360deg); } }
    @keyframes ld-bub { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-14px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { #loader .ring, #loader svg, #loader .bub { animation-duration: 4s; } }
  </style>
</head>
<body>
  <div id="loader" role="status" aria-label="Loading">
    <div class="ring">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M24 6h16M27 6v18L12 50a6 6 0 0 0 5 9h30a6 6 0 0 0 5-9L37 24V6" fill="#fff" stroke="#2f5a12" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M18 42h28l5 9a3 3 0 0 1-3 4H16a3 3 0 0 1-3-4z" fill="#7eb043"/>
        <circle class="bub" cx="26" cy="46" r="2.2" fill="#fff"/>
        <circle class="bub" cx="33" cy="49" r="1.8" fill="#fff"/>
        <circle class="bub" cx="39" cy="45" r="2" fill="#fff"/>
      </svg>
    </div>
  </div>
  <script>
    (function () {
      var hide = function () { var l = document.getElementById('loader'); if (l) { l.classList.add('done'); setTimeout(function () { l.remove(); }, 600); } };
      if (document.readyState === 'complete') hide(); else window.addEventListener('load', hide);
      setTimeout(hide, 8000);
    })();
  </script>
  <app-root></app-root>
</body>
</html>
